name: Daily LEAPS scans

on:
  schedule:
    # Two scans each weekday (times in UTC):
    # morning at 15:00 (11 am EDT / 10 am EST, after the opening rush), while option quotes are tight, and
    # evening at 23:00 (7 pm EDT / 6 pm EST), after most after-the-close earnings reports.
    - cron: "0 15 * * 1-5"
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan about 330 tickers
        run: node scripts/nightly-scan.mjs
        env:
          # Fetch through the live site, because Cboe blocks most requests from GitHub's runners.
          SCAN_VIA: https://leaps-startegy-checker.rakeshpandu17.workers.dev
      - name: Commit the new snapshot
        run: |
          git config user.name "leaps-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/scan.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Scan $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push origin HEAD:main
