name: Nightly LEAPS scan

on:
  schedule:
    # 22:30 UTC on weekdays: after the US close (6:30 pm EDT / 5:30 pm EST)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan about 330 tickers
        run: node scripts/nightly-scan.mjs
        env:
          # Fetch through the live site, because Cboe blocks most requests from GitHub's runners.
          SCAN_VIA: https://leaps-startegy-checker.rakeshpandu17.workers.dev
      - name: Commit the new snapshot
        run: |
          git config user.name "leaps-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/scan.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Nightly scan $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
